[Unit]
Wants=caihong-ssc.service
After=caihong-ssc.service

[Service]
ExecStart=
ExecStart=/usr/local/libexec/caihong-ssc/iio-sensor-proxy
Environment=LD_LIBRARY_PATH=/usr/local/lib/caihong-ssc
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
Restart=always
RestartSec=3s
