name: Validate release sources

on:
  push:
    branches: [main, fedora]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck
      - name: Validate scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m compileall -q scripts
          shellcheck -x \
            scripts/build-boot-v2.sh \
            scripts/build-caihong-audioreach-topology.sh \
            scripts/build-kernel-release.sh \
            scripts/checkout-dependencies.sh \
            scripts/collect-caihong-diagnostics.sh \
            scripts/install-caihong-modules.sh \
            scripts/package-fedora-rootfs.sh \
            scripts/verify-fedora-rootfs.sh \
            rootfs/caihong/usr/local/sbin/caihong-bluetooth-autostart \
            rootfs/caihong/usr/local/sbin/caihong-hardware-mac \
            rootfs/caihong/usr/local/sbin/caihong-mark-boot-successful \
            rootfs/caihong/usr/local/sbin/caihong-slot
          desktop-file-validate \
            rootfs/caihong/usr/share/applications/caihong-switch-to-android.desktop
      - name: Reject oversized repository objects
        run: |
          set -euo pipefail
          oversized=$(find . -path ./.git -prune -o -type f -size +95M -print)
          test -z "$oversized" || { printf '%s\n' "$oversized"; exit 1; }
      - name: Verify firmware inputs
        run: |
          (cd firmware && sha256sum -c SHA256SUMS)
          (cd firmware-assets/caihong-ssc && sha256sum -c SHA256SUMS)
