# Configuration for /usr/local/sbin/caihong-hotspot.
# The AP channel is selected from the connected STA at start time so the
# ath12k single-channel concurrency rule is respected.
HOTSPOT_SSID="Caihong-Hotspot"
HOTSPOT_PASSPHRASE="caihong-hotspot"
HOTSPOT_COUNTRY="CN"
HOTSPOT_ADDRESS="192.168.50.1/24"
HOTSPOT_SUBNET="192.168.50.0/24"
HOTSPOT_DHCP_RANGE="192.168.50.50,192.168.50.200,255.255.255.0,12h"
# Leave empty to use the managed STA interface as the upstream.
HOTSPOT_UPSTREAM=""
