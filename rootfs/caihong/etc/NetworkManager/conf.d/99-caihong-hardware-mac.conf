[connection]
# Keep the hardware address loaded from device NVRAM.  Fedora's later
# 22-wifi-mac-addr.conf otherwise restores the ath12k fallback address when a
# connection activates.
wifi.cloned-mac-address=preserve

[device]
wifi.scan-rand-mac-address=no
