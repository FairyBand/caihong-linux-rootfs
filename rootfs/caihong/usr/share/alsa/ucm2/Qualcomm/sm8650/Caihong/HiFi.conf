SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 1,1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1,1"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 0,0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers"

	EnableSequence [
		cset "name='Amp0 PCM Playback Volume' 360"
		cset "name='Amp1 PCM Playback Volume' 360"
		cset "name='Amp2 PCM Playback Volume' 360"
		cset "name='Amp3 PCM Playback Volume' 360"
		cset "name='Amp5 PCM Playback Volume' 360"
		cset "name='Amp6 PCM Playback Volume' 360"
	]

	DisableSequence [
		cset "name='Amp0 PCM Playback Volume' 0"
		cset "name='Amp1 PCM Playback Volume' 0"
		cset "name='Amp2 PCM Playback Volume' 0"
		cset "name='Amp3 PCM Playback Volume' 0"
		cset "name='Amp5 PCM Playback Volume' 0"
		cset "name='Amp6 PCM Playback Volume' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Mic1" {
	Comment "Built-in microphones"

	EnableSequence [
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='ADC1 Volume' 6"
		cset "name='ADC2 Volume' 6"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC2 MUX' CH2_AMIC3"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX1 MODE' ADC_INVALID"
	]

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
	}
}
